name: Restore official Gradle wrapper
on:
  push:
    branches: [chatgpt/gradle-wrapper-bootstrap]
    paths: [.github/workflows/restore-wrapper.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wrapper:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic
      - name: Generate only portable Gradle launchers
        run: |
          mkdir -p "$RUNNER_TEMP/wrapper-empty"
          touch "$RUNNER_TEMP/wrapper-empty/settings.gradle"
          gradle --no-daemon -p "$RUNNER_TEMP/wrapper-empty" wrapper --gradle-version 9.3.1 --distribution-type bin
          cp "$RUNNER_TEMP/wrapper-empty/gradlew" .
          cp "$RUNNER_TEMP/wrapper-empty/gradlew.bat" .
          cp "$RUNNER_TEMP/wrapper-empty/gradle/wrapper/gradle-wrapper.jar" gradle/wrapper/
          echo 'b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
          chmod +x gradlew
      - name: Commit only wrapper files to helper branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
          if ! git diff --cached --quiet; then
            git commit -m 'build: restore official Gradle 9.3.1 wrapper'
            git push origin HEAD:refs/heads/chatgpt/gradle-wrapper-bootstrap
          fi
