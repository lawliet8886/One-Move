name: Import Reviewed Mascot Art
on:
  push:
    branches: [chatgpt/android-lab]
    paths: ['.github/workflows/import-reviewed-art.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  import-reviewed-art:
    if: github.repository == 'lawliet8886/One-Move' && github.ref == 'refs/heads/chatgpt/android-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Download only the reviewed original render run
        uses: actions/download-artifact@v5
        with:
          name: original-mascot-art
          run-id: 35732939923
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .reviewed-art
      - name: Install image packer (no inference)
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y --no-install-recommends python3-pil
      - name: Validate provenance and pack the 12 reviewed expressions
        shell: bash
        run: |
          /usr/bin/python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          from PIL import Image
          root = Path('.reviewed-art')
          data = (root/'manifest.json').read_bytes()
          assert hashlib.sha256(data).hexdigest() == '654da59825e78d8f4e9e6018c2973f26fdf05ce17a4eb0c3cd79354109933533'
          manifest = json.loads(data)
          assert manifest['source_commit'] == '78c361dd6c18838f649dbda8a5f2567575fd2bb7'
          names = ['pip','mochi','blobbo']
          expressions = ['neutral','happy','surprised','dizzy']
          expected = {f'hero_{n}_{e}.png' for n in names for e in expressions}
          assert {s['file'] for s in manifest['sprites']} == expected
          for item in manifest['sprites']:
              file = root/item['file']
              assert hashlib.sha256(file.read_bytes()).hexdigest() == item['sha256']
              with Image.open(file) as im:
                  assert im.size == (384,384) and im.mode == 'RGBA'
                  assert im.getchannel('A').getextrema() == (0,255)
          cell = 192
          atlas = Image.new('RGBA',(cell*4,cell*3))
          for row,name in enumerate(names):
              for col,expr in enumerate(expressions):
                  with Image.open(root/f'hero_{name}_{expr}.png') as image:
                      atlas.paste(image.resize((cell,cell),Image.Resampling.LANCZOS),(col*cell,row*cell))
          dest = Path('app/src/main/assets/mascots')
          dest.mkdir(parents=True,exist_ok=True)
          atlas.save(dest/'atlas.webp',format='WEBP',quality=92,method=6)
          manifest.update({'source_run':35732939923,'source_artifact':10695833011,
              'source_manifest_sha256':hashlib.sha256(data).hexdigest(),
              'atlas_sha256':hashlib.sha256((dest/'atlas.webp').read_bytes()).hexdigest(),
              'atlas_size':[768,576],'cell_size':cell,'rows':names,'columns':expressions,
              'physical_body_radius_per_cell':1/3.6,
              'review':'Visual review of all twelve original Blender renders before import. Not gameplay evidence.'})
          (dest/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print('VERIFIED: original 12-expression alpha atlas; physical pivot and provenance retained.')
          PY
      - name: Commit only atlas and manifest without replacing newer work
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chatgpt/android-lab
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin chatgpt/android-lab
          test "$(git rev-parse origin/chatgpt/android-lab)" = "$GITHUB_SHA"
          git add -- app/src/main/assets/mascots/atlas.webp app/src/main/assets/mascots/manifest.json
          if git diff --cached --quiet; then echo 'Atlas already matches; no commit needed.'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'art: preserve reviewed original mascot atlas in repository'
          git push origin HEAD:refs/heads/chatgpt/android-lab
          git rev-parse HEAD
