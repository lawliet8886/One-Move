name: Android Lab

on:
  push:
    branches:
      - chatgpt/android-lab
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Run fast unit and Robolectric smoke tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.example.ExampleUnitTest \
            --tests com.example.ExampleRobolectricTest \
            --stacktrace --no-daemon

      - name: Upload smoke test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: one-move-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  physics-regression:
    needs: build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run campaign physics matrix
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.example.VerticalSliceOutcomeMatrixTest \
            --stacktrace --no-daemon

      - name: Upload physics reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-regression-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/qa_artifacts/**
            qa_artifacts/**
          if-no-files-found: ignore
