name: Android Lab

on:
  push:
    branches: [chatgpt/android-lab]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Package exact review sources without local caches
        shell: bash
        run: |
          git rev-parse HEAD > one-move-review-head.txt
          git archive --format=zip --output=one-move-review-source.zip HEAD app/src tools/ci tools/art docs .github/workflows
      - name: Upload source snapshot for reproducible review
        uses: actions/upload-artifact@v4
        with:
          name: one-move-review-source
          path: |
            one-move-review-source.zip
            one-move-review-head.txt
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Compile app and device test APKs
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: one-move-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Run fast unit and Robolectric smoke tests
        run: |
          gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --tests com.example.ExampleRobolectricTest --stacktrace --no-daemon
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  physics-regression:
    needs: build-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Run campaign matrix and independent contracts
        run: |
          gradle :app:testDebugUnitTest \
            --tests com.example.VerticalSliceOutcomeMatrixTest \
            --tests com.example.PhysicsContractTest \
            --tests com.example.PinHitTesterTest \
            --stacktrace --no-daemon
      - name: Upload physics and input reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-regression-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
            app/build/reports/physics-contract/**
          if-no-files-found: error
          retention-days: 7

  device-journey:
    needs: physics-regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false
      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android playthrough and recording
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none -camera-front none
          script: bash tools/ci/device-journey.sh
      - name: Upload actual device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-move-device-journey
          path: |
            device_artifacts/**
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          if-no-files-found: ignore
          retention-days: 7
