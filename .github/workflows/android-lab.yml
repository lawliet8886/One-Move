name: One Move Android Lab

on:
  push:
    branches: [chatgpt/android-lab-20260922]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic
      - name: Record exact revision and environment
        run: |
          mkdir -p lab-evidence
          git rev-parse HEAD > lab-evidence/commit.txt
          java -version 2> lab-evidence/java.txt
          gradle --version > lab-evidence/gradle.txt
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile APK and execute existing tests
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --console=plain :app:assembleDebug :app:testDebugUnitTest 2>&1 | tee lab-evidence/build.log
      - name: Regenerate portable Gradle wrapper
        if: success()
        run: gradle --no-daemon wrapper --gradle-version 9.3.1 --distribution-type bin
      - name: Preserve APK, reports, logs and wrapper
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-move-baseline-${{ github.run_number }}
          retention-days: 14
          include-hidden-files: false
          path: |
            lab-evidence/
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/build/test-results/
            gradlew
            gradlew.bat
            gradle/wrapper/
